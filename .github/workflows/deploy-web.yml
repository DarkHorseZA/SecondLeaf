name: Deploy web preview to GitHub Pages

on:
  push:
    branches:
      - claude/secondleaf-mobile-app-ezDtE
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build v1 (default)
        env:
          EXPO_PUBLIC_VARIANT: v1
        run: npx expo export --platform web --output-dir dist

      - name: Build v2
        # v2 lives at /SecondLeaf/v2/. If it fails we still ship v1 below.
        continue-on-error: true
        env:
          EXPO_PUBLIC_VARIANT: v2
        run: |
          npx expo export --platform web --output-dir dist-v2
          mkdir -p dist/v2
          cp -R dist-v2/. dist/v2/

      - name: SPA fallback + Pages polish
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          if [ -f dist/v2/index.html ]; then cp dist/v2/index.html dist/v2/404.html; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
